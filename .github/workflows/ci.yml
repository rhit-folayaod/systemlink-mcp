name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest
        env:
          SYSTEMLINK_MCP_SIMULATE: "1"
